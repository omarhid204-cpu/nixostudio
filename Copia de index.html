<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIXO STUDIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
/* ============================================================
   NIXO STUDIO — Sistema de diseño
   Display: Space Grotesk · Body: Inter · Mono: JetBrains Mono
   ============================================================ */

:root{
  --ink:#0B0B0D;
  --ink-soft:#131418;
  --graphite:#3B3F46;
  --mute:#8A8F98;
  --line:rgba(11,11,13,.10);
  --line-dark:rgba(255,255,255,.10);
  --fog:#F5F6F8;
  --white:#FFFFFF;
  --blue:#2C5CFF;
  --blue-soft:#5E86FF;
  --blue-tint:rgba(44,92,255,.08);
  --radius:16px;
  --radius-lg:24px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --shadow:0 20px 50px -24px rgba(11,11,13,.28);
  --maxw:1180px;
  --pad:clamp(20px,5vw,64px);
  font-synthesis:none;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

body{
  font-family:"Inter",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:var(--white);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

h1,h2,h3,h4{font-family:"Space Grotesk",sans-serif;line-height:1.08;letter-spacing:-.02em;font-weight:600}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}

.mono{font-family:"JetBrains Mono",monospace;letter-spacing:.02em}
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}

/* ---------- Eyebrow / labels ---------- */
.eyebrow{
  font-family:"JetBrains Mono",monospace;
  font-size:12px;text-transform:uppercase;letter-spacing:.18em;
  color:var(--blue);display:inline-flex;align-items:center;gap:10px;margin-bottom:18px;
}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--blue);display:inline-block}
.section-dark .eyebrow{color:var(--blue-soft)}

/* ---------- Section rhythm ---------- */
.block{padding:clamp(72px,10vw,140px) 0}
.block-head{max-width:640px;margin-bottom:56px}
.block-head h2{font-size:clamp(30px,4.6vw,52px)}
.block-head p{color:var(--mute);font-size:clamp(16px,2vw,19px);margin-top:18px;max-width:560px}
.section-dark{background:var(--ink);color:var(--white)}
.section-dark .block-head p{color:#B7BCC6}
.section-fog{background:var(--fog)}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:10px;
  font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:15px;
  padding:15px 26px;border-radius:100px;border:1px solid transparent;
  cursor:pointer;transition:transform .3s var(--ease),background .3s var(--ease),box-shadow .3s var(--ease),color .3s var(--ease);
  white-space:nowrap;
}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 12px 30px -12px rgba(44,92,255,.7)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 18px 40px -12px rgba(44,92,255,.85)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink);transform:translateY(-2px)}
.section-dark .btn-ghost,.hero .btn-ghost{border-color:rgba(255,255,255,.22);color:#fff}
.section-dark .btn-ghost:hover,.hero .btn-ghost:hover{border-color:#fff;background:rgba(255,255,255,.06)}

/* ============================================================
   HEADER
   ============================================================ */
.site-header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  transition:background .4s var(--ease),box-shadow .4s var(--ease),padding .4s var(--ease);
  padding:20px 0;
}
.site-header.scrolled{
  background:rgba(255,255,255,.82);
  backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  box-shadow:0 1px 0 var(--line);
  padding:12px 0;
}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:12px;font-family:"Space Grotesk",sans-serif;font-weight:700;letter-spacing:-.01em}
.brand img{height:auto;width:auto}
.brand .brand-name{font-size:19px}
.nav-links{display:flex;align-items:center;gap:34px}
.nav-links a{font-size:15px;color:var(--graphite);position:relative;transition:color .25s}
.nav-links a::after{content:"";position:absolute;left:0;bottom:-6px;width:0;height:2px;background:var(--blue);transition:width .3s var(--ease)}
.nav-links a:hover,.nav-links a.active{color:var(--ink)}
.nav-links a.active::after,.nav-links a:hover::after{width:100%}
.header-cta{display:flex;align-items:center;gap:16px}
.burger{display:none;flex-direction:column;gap:5px;background:none;border:0;cursor:pointer;padding:8px}
.burger span{width:24px;height:2px;background:var(--ink);transition:.3s var(--ease)}
.burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

.mobile-menu{
  position:fixed;inset:0 0 0 auto;width:min(84vw,360px);z-index:99;
  background:var(--ink);color:#fff;transform:translateX(100%);
  transition:transform .4s var(--ease);display:flex;flex-direction:column;
  padding:110px 34px 40px;gap:6px;
}
.mobile-menu.open{transform:translateX(0)}
.mobile-menu a{font-family:"Space Grotesk",sans-serif;font-size:24px;padding:14px 0;border-bottom:1px solid var(--line-dark)}
.mobile-menu .btn{margin-top:24px;justify-content:center}
.menu-overlay{position:fixed;inset:0;background:rgba(11,11,13,.5);opacity:0;visibility:hidden;transition:.3s;z-index:98}
.menu-overlay.open{opacity:1;visibility:visible}

/* ============================================================
   HERO
   ============================================================ */
.hero{
  position:relative;min-height:100vh;display:flex;align-items:center;
  background:var(--ink);color:#fff;overflow:hidden;padding-top:120px;padding-bottom:60px;
}
.hero-bg{position:absolute;inset:0;z-index:0}
.hero-bg img{width:100%;height:100%;object-fit:cover;opacity:.16;filter:grayscale(1)}
.hero-grid{
  position:absolute;inset:0;z-index:1;
  background-image:linear-gradient(var(--line-dark) 1px,transparent 1px),linear-gradient(90deg,var(--line-dark) 1px,transparent 1px);
  background-size:64px 64px;mask-image:radial-gradient(circle at 30% 40%,#000,transparent 72%);
  -webkit-mask-image:radial-gradient(circle at 30% 40%,#000,transparent 72%);
}
.hero-glow{
  position:absolute;width:640px;height:640px;border-radius:50%;z-index:1;
  background:radial-gradient(circle,rgba(44,92,255,.55),transparent 62%);
  filter:blur(30px);top:-120px;right:-80px;transition:transform .6s var(--ease);
}
.hero .wrap{position:relative;z-index:2}
.hero-eyebrow{color:var(--blue-soft)}
.hero h1{font-size:clamp(38px,7vw,86px);max-width:15ch;font-weight:700}
.hero p{color:#C4C9D4;font-size:clamp(17px,2.2vw,21px);max-width:56ch;margin:26px 0 38px}
.hero-actions{display:flex;flex-wrap:wrap;gap:14px}
.hero-stats{
  display:grid;grid-template-columns:repeat(5,1fr);gap:28px;
  margin-top:clamp(52px,8vw,88px);padding-top:38px;border-top:1px solid var(--line-dark);
}
.hero-stats .stat .num{font-family:"Space Grotesk",sans-serif;font-size:clamp(26px,3.4vw,40px);font-weight:700}
.hero-stats .stat .num b{color:var(--blue-soft);font-weight:700}
.hero-stats .stat .lbl{font-size:12.5px;color:var(--mute);margin-top:6px;line-height:1.35}

/* ============================================================
   POR QUÉ / grid de beneficios
   ============================================================ */
.why-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.why-cell{background:var(--white);padding:32px 28px;transition:background .3s var(--ease)}
.why-cell:hover{background:var(--fog)}
.why-cell .ic{width:44px;height:44px;border-radius:12px;background:var(--blue-tint);color:var(--blue);display:grid;place-items:center;margin-bottom:20px}
.why-cell .ic svg{width:22px;height:22px}
.why-cell h3{font-size:18px;margin-bottom:8px}
.why-cell p{font-size:14.5px;color:var(--mute)}

/* ============================================================
   SERVICIOS
   ============================================================ */
.serv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.serv-card{
  position:relative;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  padding:30px;overflow:hidden;transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s var(--ease);
}
.serv-card::before{content:"";position:absolute;left:0;top:0;height:100%;width:3px;background:var(--blue);transform:scaleY(0);transform-origin:top;transition:transform .35s var(--ease)}
.serv-card:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:transparent}
.serv-card:hover::before{transform:scaleY(1)}
.serv-card .idx{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--mute)}
.serv-card h3{font-size:21px;margin:14px 0 10px}
.serv-card p{font-size:15px;color:var(--mute)}

/* ============================================================
   PROCESO
   ============================================================ */
.proc-list{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-dark);border:1px solid var(--line-dark);border-radius:var(--radius-lg);overflow:hidden}
.proc-step{background:var(--ink);padding:34px 30px;position:relative;transition:background .3s var(--ease)}
.proc-step:hover{background:var(--ink-soft)}
.proc-step .n{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--blue-soft);margin-bottom:20px;display:block}
.proc-step h3{font-size:20px;color:#fff;margin-bottom:10px}
.proc-step p{font-size:14.5px;color:#AEB4BF}

/* ============================================================
   PORTAFOLIO
   ============================================================ */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:40px}
.filter-btn{
  font-family:"JetBrains Mono",monospace;font-size:12.5px;letter-spacing:.04em;
  padding:9px 16px;border-radius:100px;border:1px solid var(--line);background:transparent;color:var(--graphite);
  cursor:pointer;transition:.25s var(--ease);
}
.filter-btn:hover{border-color:var(--ink)}
.filter-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}

.port-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.port-card{
  position:relative;border-radius:var(--radius);overflow:hidden;background:var(--ink-soft);
  aspect-ratio:4/5;cursor:pointer;transition:transform .4s var(--ease);
}
.port-card img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease),filter .4s var(--ease)}
.port-card:hover{transform:translateY(-4px)}
.port-card:hover img{transform:scale(1.06)}
.port-overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  padding:26px;color:#fff;
  background:linear-gradient(to top,rgba(11,11,13,.92) 12%,rgba(11,11,13,.2) 55%,transparent);
  opacity:0;transform:translateY(14px);transition:.4s var(--ease);
}
.port-card:hover .port-overlay{opacity:1;transform:translateY(0)}
.port-overlay .ind{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-soft)}
.port-overlay h3{font-size:23px;margin:8px 0 10px}
.port-overlay p{font-size:14px;color:#C9CDD6;margin-bottom:16px}
.port-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.port-tags span{font-size:11px;font-family:"JetBrains Mono",monospace;padding:5px 10px;border:1px solid rgba(255,255,255,.2);border-radius:100px}
.port-overlay .btn{align-self:flex-start;padding:11px 20px;font-size:13.5px}
.port-static{position:absolute;left:0;bottom:0;padding:22px;color:#fff;transition:opacity .3s}
.port-static .ind{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#C9CDD6}
.port-static h3{font-size:20px;margin-top:4px;text-shadow:0 2px 20px rgba(0,0,0,.6)}
.port-card:hover .port-static{opacity:0}

/* ============================================================
   PROYECTO individual
   ============================================================ */
.proj-hero{padding-top:150px;padding-bottom:20px}
.proj-hero .back{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--mute);display:inline-flex;gap:8px;align-items:center;margin-bottom:26px}
.proj-hero .back:hover{color:var(--blue)}
.proj-hero h1{font-size:clamp(34px,6vw,64px);max-width:16ch}
.proj-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.proj-meta span{font-family:"JetBrains Mono",monospace;font-size:12px;padding:7px 14px;border:1px solid var(--line);border-radius:100px;color:var(--graphite)}
.proj-gallery{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:16px 0 0}
.proj-gallery img{width:100%;border-radius:var(--radius);aspect-ratio:16/10;object-fit:cover}
.proj-gallery img:first-child:nth-last-child(1){grid-column:1/-1}
.proj-detail{display:grid;grid-template-columns:repeat(2,1fr);gap:28px}
.proj-detail .card{background:var(--fog);border-radius:var(--radius);padding:32px}
.proj-detail .card .lab{font-family:"JetBrains Mono",monospace;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--blue);margin-bottom:12px}
.proj-detail .card p{color:var(--graphite);font-size:16px}

/* ============================================================
   DEMOS
   ============================================================ */
.demo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.demo-card{
  border:1px solid var(--line-dark);border-radius:var(--radius);padding:30px;background:var(--ink-soft);
  display:flex;flex-direction:column;gap:14px;transition:transform .35s var(--ease),border-color .35s var(--ease);
}
.demo-card:hover{transform:translateY(-6px);border-color:var(--blue)}
.demo-card h3{color:#fff;font-size:21px}
.demo-card p{color:#AEB4BF;font-size:14.5px;flex-grow:1}
.demo-card a{color:var(--blue-soft);font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:15px;display:inline-flex;gap:8px;align-items:center}

/* ============================================================
   RESULTADOS
   ============================================================ */
.res-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.res-cell{text-align:center;padding:20px}
.res-cell .num{font-family:"Space Grotesk",sans-serif;font-size:clamp(40px,6vw,68px);font-weight:700;color:var(--blue)}
.res-cell .lbl{color:var(--mute);font-size:14px;margin-top:8px}

/* ============================================================
   TESTIMONIOS
   ============================================================ */
.test-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.test-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:32px;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.test-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.test-card .stars{color:var(--blue);letter-spacing:3px;margin-bottom:16px;font-size:15px}
.test-card blockquote{font-size:16px;color:var(--ink);line-height:1.65;margin-bottom:24px}
.test-who{display:flex;align-items:center;gap:14px}
.test-who img{width:46px;height:46px;border-radius:50%;object-fit:cover}
.test-who .nm{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:15px}
.test-who .co{font-size:13px;color:var(--mute)}

/* ============================================================
   TECNOLOGÍA
   ============================================================ */
.tech-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.tech-row{background:var(--white);padding:28px 30px;display:flex;gap:18px;align-items:flex-start;transition:background .3s}
.tech-row:hover{background:var(--fog)}
.tech-row .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:9px;flex-shrink:0}
.tech-row h3{font-size:18px;margin-bottom:6px}
.tech-row p{font-size:14.5px;color:var(--mute)}

/* ============================================================
   FAQ
   ============================================================ */
.faq-list{max-width:820px;margin:0 auto}
.faq-item{border-bottom:1px solid var(--line)}
.faq-q{
  width:100%;background:none;border:0;cursor:pointer;text-align:left;
  display:flex;justify-content:space-between;align-items:center;gap:20px;
  padding:26px 0;font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:clamp(17px,2.4vw,21px);color:var(--ink);
}
.faq-q .pm{width:24px;height:24px;flex-shrink:0;position:relative;transition:transform .35s var(--ease)}
.faq-q .pm::before,.faq-q .pm::after{content:"";position:absolute;background:var(--blue);border-radius:2px;top:50%;left:50%;transform:translate(-50%,-50%)}
.faq-q .pm::before{width:16px;height:2px}
.faq-q .pm::after{width:2px;height:16px;transition:transform .35s var(--ease)}
.faq-item.open .pm::after{transform:translate(-50%,-50%) scaleY(0)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .4s var(--ease)}
.faq-a p{padding:0 0 26px;color:var(--graphite);font-size:16px;max-width:70ch}

/* ============================================================
   CTA FINAL
   ============================================================ */
.cta-final{position:relative;min-height:80vh;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;overflow:hidden;background:var(--ink)}
.cta-final .cta-bg{position:absolute;inset:0}
.cta-final .cta-bg img{width:100%;height:100%;object-fit:cover;opacity:.22;filter:grayscale(.5)}
.cta-final::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,rgba(44,92,255,.35),transparent 60%)}
.cta-final .wrap{position:relative;z-index:2;max-width:840px}
.cta-final h2{font-size:clamp(32px,5.5vw,62px);margin-bottom:22px}
.cta-final p{font-size:clamp(17px,2.2vw,21px);color:#C9CDD6;margin-bottom:40px;max-width:60ch;margin-left:auto;margin-right:auto}
.cta-final .btn{font-size:17px;padding:19px 40px}

/* ============================================================
   CONTACTO / formulario
   ============================================================ */
.contact-split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.contact-info h2{font-size:clamp(30px,4.5vw,48px);margin-bottom:20px}
.contact-info p{color:var(--mute);font-size:18px;margin-bottom:34px;max-width:44ch}
.contact-lines{display:flex;flex-direction:column;gap:18px}
.contact-line{display:flex;align-items:center;gap:14px;font-size:15px}
.contact-line .ic{width:42px;height:42px;border-radius:12px;background:var(--fog);display:grid;place-items:center;color:var(--blue)}
.contact-line .ic svg{width:20px;height:20px}
.contact-line a:hover{color:var(--blue)}
.form-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);padding:clamp(26px,4vw,44px);box-shadow:var(--shadow)}
.field{margin-bottom:20px}
.field label{display:block;font-family:"JetBrains Mono",monospace;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--graphite);margin-bottom:9px}
.field input,.field textarea{
  width:100%;padding:15px 16px;border:1px solid var(--line);border-radius:12px;
  font-family:inherit;font-size:15px;color:var(--ink);background:var(--fog);transition:border-color .25s,background .25s;
}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--blue);background:#fff}
.field textarea{resize:vertical;min-height:110px}
.form-card .btn{width:100%;justify-content:center;margin-top:6px}

/* ============================================================
   FOOTER
   ============================================================ */
.site-footer{background:var(--ink);color:#fff;padding:80px 0 34px}
.footer-top{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px;padding-bottom:52px;border-bottom:1px solid var(--line-dark)}
.footer-brand .brand-name{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:22px}
.footer-brand p{color:#AEB4BF;font-size:14.5px;margin-top:16px;max-width:34ch}
.footer-socials{display:flex;gap:12px;margin-top:22px}
.footer-socials a{width:40px;height:40px;border:1px solid var(--line-dark);border-radius:10px;display:grid;place-items:center;transition:.25s}
.footer-socials a:hover{background:var(--blue);border-color:var(--blue)}
.footer-socials svg{width:18px;height:18px}
.footer-col h4{font-family:"JetBrains Mono",monospace;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);margin-bottom:18px;font-weight:500}
.footer-col a{display:block;color:#C9CDD6;font-size:14.5px;padding:6px 0;transition:color .2s}
.footer-col a:hover{color:#fff}
.footer-bottom{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-top:26px}
.footer-bottom p{color:var(--mute);font-size:13px}
.footer-bottom a{color:var(--mute);font-size:13px}
.footer-bottom a:hover{color:#fff}

/* ============================================================
   WhatsApp flotante
   ============================================================ */
.wa-float{
  position:fixed;bottom:26px;right:26px;z-index:90;
  width:60px;height:60px;border-radius:50%;background:#25D366;
  display:grid;place-items:center;box-shadow:0 12px 30px -8px rgba(37,211,102,.6);
  transition:transform .3s var(--ease);
}
.wa-float:hover{transform:scale(1.08)}
.wa-float svg{width:30px;height:30px;fill:#fff}

/* ============================================================
   LOADER
   ============================================================ */
.loader{position:fixed;inset:0;z-index:9999;background:var(--ink);display:grid;place-items:center;transition:opacity .5s var(--ease),visibility .5s}
.loader.hidden{opacity:0;visibility:hidden}
.loader .mark{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:26px;color:#fff;letter-spacing:.02em;display:flex;align-items:center;gap:12px}
.loader .bar{width:120px;height:2px;background:var(--line-dark);margin-top:20px;border-radius:2px;overflow:hidden}
.loader .bar i{display:block;height:100%;width:40%;background:var(--blue);animation:load 1s infinite var(--ease)}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}

/* ---------- Scroll reveal ---------- */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none}
  .hero-glow,.loader .bar i{animation:none}
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:1024px){
  .why-grid,.serv-grid,.proc-list,.port-grid,.demo-grid,.res-grid,.test-grid{grid-template-columns:repeat(2,1fr)}
  .hero-stats{grid-template-columns:repeat(3,1fr);gap:22px}
  .footer-top{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .nav-links,.header-cta .btn{display:none}
  .burger{display:flex}
  .why-grid,.serv-grid,.proc-list,.port-grid,.demo-grid,.res-grid,.test-grid,.tech-grid,.proj-detail,.proj-gallery{grid-template-columns:1fr}
  .hero-stats{grid-template-columns:repeat(2,1fr)}
  .contact-split{grid-template-columns:1fr;gap:36px}
  .footer-top{grid-template-columns:1fr 1fr;gap:30px}
  .footer-brand{grid-column:1/-1}
}
@media (max-width:420px){
  .hero-stats{grid-template-columns:1fr 1fr}
  .footer-top{grid-template-columns:1fr}
}

  }

  /* ---------- Proyecto individual ---------- */
  function proyectoView(d, id) {
    var projs = (d.portafolio && d.portafolio.proyectos) || [];
    var pr = null;
    for (var i = 0; i < projs.length; i++) { if (projs[i].id === id) { pr = projs[i]; break; } }
    if (!pr) pr = projs[0];
    if (!pr) return '<section class="block" style="padding-top:150px"><div class="wrap"><h1>Proyecto no encontrado</h1><p style="margin-top:16px"><a class="btn btn-ghost" href="#portafolio">Volver al portafolio</a></p></div></section>';

    var gallery = (pr.imagenes || []).map(function (im) { return '<img src="' + esc(im) + '" alt="' + esc(pr.nombre) + '">'; }).join("");
    var meta = [pr.industria].concat(pr.tecnologias || []).filter(Boolean).map(function (t) { return "<span>" + esc(t) + "</span>"; }).join("");
    var detail = [["Objetivo", pr.objetivo], ["Problema", pr.problema], ["Solución", pr.solucion], ["Resultado", pr.resultado]]
      .filter(function (x) { return x[1]; })
      .map(function (x) { return '<div class="card"><div class="lab">' + esc(x[0]) + "</div><p>" + esc(x[1]) + "</p></div>"; }).join("");

    return '<section class="proj-hero block"><div class="wrap">' +
        '<a href="#portafolio" class="back reveal">' + icon("arrowl") + " Portafolio</a>" +
        '<h1 class="reveal">' + esc(pr.nombre) + "</h1>" +
        '<div class="proj-meta reveal">' + meta + "</div></div></section>" +
      (gallery ? '<section style="padding-bottom:0"><div class="wrap"><div class="proj-gallery reveal">' + gallery + "</div></div></section>" : "") +
      '<section class="block"><div class="wrap"><div class="proj-detail">' + detail + "</div></div></section>" +
      ctaFinalSection(d);
  }

  /* ---------- Contacto ---------- */
  function contactoView(d) {
    var c = d.contacto || {};
    return '<section class="block" style="padding-top:150px"><div class="wrap"><div class="contact-split">' +
        '<div class="contact-info reveal"><span class="eyebrow">Contacto</span><h2>Cuéntanos de tu proyecto</h2>' +
          "<p>Respondemos rápido por WhatsApp. Escríbenos o llena el formulario y te contactamos.</p>" +
          '<div class="contact-lines">' +
            (c.correo ? '<div class="contact-line"><span class="ic">' + icon("mail") + '</span><a href="mailto:' + esc(c.correo) + '">' + esc(c.correo) + "</a></div>" : "") +
            (c.telefono ? '<div class="contact-line"><span class="ic">' + icon("phone") + '</span><a href="tel:' + esc(String(c.telefono).replace(/\s/g, "")) + '">' + esc(c.telefono) + "</a></div>" : "") +
            '<div class="contact-line"><span class="ic">' + icon("wa") + '</span><a href="' + wa(d) + '" target="_blank" rel="noopener">Escríbenos por WhatsApp</a></div>' +
          "</div></div>" +
        '<div class="form-card reveal">' +
          '<div class="field"><label>Nombre</label><input id="fNombre" type="text" placeholder="Tu nombre"></div>' +
          '<div class="field"><label>Empresa</label><input id="fEmpresa" type="text" placeholder="Nombre de tu empresa"></div>' +
          '<div class="field"><label>¿Qué necesitas?</label><textarea id="fMensaje" placeholder="Cuéntanos brevemente tu proyecto..."></textarea></div>' +
          '<button class="btn btn-primary" id="fEnviar">' + icon("wa") + " Enviar por WhatsApp</button>" +
        "</div></div></div></section>" +
      faqSection(d) + ctaFinalSection(d);
  }

  function initContactForm(d) {
    var b = el("fEnviar"); if (!b) return;
    b.addEventListener("click", function () {
      var n = (el("fNombre").value || "").trim(), e = (el("fEmpresa").value || "").trim(), m = (el("fMensaje").value || "").trim();
      var msg = "Hola NIXO STUDIO,";
      if (n) msg += " soy " + n;
      if (e) msg += " de " + e;
      msg += ".";
      msg += m ? " " + m : " Quiero información sobre una página web.";
      window.open(wa(d, msg), "_blank", "noopener");
    });
  }

  /* ---------- Interacciones ---------- */
  function initReveal() {
    var items = document.querySelectorAll(".reveal");
    if (!("IntersectionObserver" in window)) { items.forEach(function (i) { i.classList.add("in"); }); return; }
    var io = new IntersectionObserver(function (ents) {
      ents.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } });
    }, { threshold: 0.12, rootMargin: "0px 0px -8% 0px" });
    items.forEach(function (i) { io.observe(i); });
  }

  function initCounters() {
    var nums = document.querySelectorAll("[data-count]");
    var reduce = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
    var run = function (node) {
      var target = parseFloat(node.dataset.count) || 0;
      var sfx = node.querySelector("b, span") ? node.querySelector("b, span").outerHTML : "";
      if (reduce) { node.innerHTML = target + sfx; return; }
      var dur = 1400, start = performance.now();
      var step = function (now) {
        var p = Math.min((now - start) / dur, 1);
        node.innerHTML = Math.round(target * (1 - Math.pow(1 - p, 3))) + sfx;
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    };
    if (!("IntersectionObserver" in window)) { nums.forEach(run); return; }
    var io = new IntersectionObserver(function (ents) {
      ents.forEach(function (en) { if (en.isIntersecting) { run(en.target); io.unobserve(en.target); } });
    }, { threshold: 0.5 });
    nums.forEach(function (n) { io.observe(n); });
  }

  function initFAQ() {
    document.querySelectorAll(".faq-q").forEach(function (q) {
      q.addEventListener("click", function () {
        var item = q.closest(".faq-item"), a = item.querySelector(".faq-a");
        var open = item.classList.toggle("open");
        a.style.maxHeight = open ? a.scrollHeight + "px" : 0;
      });
    });
  }

  function initHeroGlow() {
    var glow = el("heroGlow"); if (!glow) return;
    if (window.matchMedia("(prefers-reduced-motion:reduce)").matches) return;
    var hero = glow.closest(".hero");
    hero.addEventListener("pointermove", function (e) {
      var r = hero.getBoundingClientRect();
      glow.style.transform = "translate(" + (e.clientX - r.left - r.width / 2) * 0.06 + "px," + (e.clientY - r.top - r.height / 2) * 0.06 + "px)";
    });
  }

  /* ---------- Render de vista ---------- */
  function renderView() {
    var d = DATA, route = currentRoute(), html = "";
    if (route.name === "servicios") {
      html = '<div style="height:90px"></div>' + serviciosSection(d) + procesoSection(d) + tecnologiaSection(d) + ctaFinalSection(d);
    } else if (route.name === "portafolio") {
      html = '<div style="height:90px"></div>' + portafolioSection(d, true) + ctaFinalSection(d);
    } else if (route.name === "contacto") {
      html = contactoView(d);
    } else {
      html = heroSection(d) + porqueSection(d) + resultadosSection(d) + testimoniosSection(d) + ctaFinalSection(d);
    }
    el("main").innerHTML = html;
    window.scrollTo(0, 0);
    setActiveNav();
    initReveal(); initCounters(); initFAQ(); initHeroGlow();
    if (route.name === "portafolio") initFilters();
    if (route.name === "contacto") initContactForm(d);
  }

  /* ---------- SEO ---------- */
  function applySEO(d) {
    var s = d.seo || {};
    if (s.titulo) document.title = s.titulo;
    var setMeta = function (name, val, prop) {
      if (!val) return;
      var t = document.querySelector("meta[" + (prop ? "property" : "name") + '="' + name + '"]');
      if (!t) { t = document.createElement("meta"); t.setAttribute(prop ? "property" : "name", name); document.head.appendChild(t); }
      t.setAttribute("content", val);
    };
    setMeta("description", s.descripcion);
    setMeta("og:title", s.titulo, true);
    setMeta("og:description", s.descripcion, true);
    setMeta("og:image", s.imagen_compartir, true);
  }

  function init(d) {
    DATA = d;
    applySEO(d);
    renderHeader(d);
    renderFooter(d);
    renderWA(d);
    renderView();
    window.addEventListener("hashchange", renderView);
    var loader = el("loader");
    if (loader) setTimeout(function () { loader.classList.add("hidden"); }, 350);
  }

  fetch("content.json?v=" + Date.now())
    .then(function (r) { if (!r.ok) throw new Error("content.json no disponible"); return r.json(); })
    .then(init)
    .catch(function (err) {
      console.error(err);
      var loader = el("loader");
      if (loader) loader.innerHTML = '<div style="color:#fff;text-align:center;max-width:340px;padding:20px"><p style="font-family:\'Space Grotesk\';font-weight:600;font-size:18px">No se pudo cargar el contenido</p><p style="color:#8A8F98;margin-top:10px;font-size:14px">Revisa que content.json esté publicado en la raíz del sitio.</p></div>';
    });
})();
  </script>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    if (
      window.location.hash.includes('invite_token') ||
      window.location.hash.includes('recovery_token') ||
      window.location.hash.includes('confirmation_token')
    ) {
      window.location.href = "/admin/" + window.location.hash;
    }
  </script>
